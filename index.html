function about(){shell('О проекте').innerHTML='<div class="card"><h3>Vibe Coding: исследование возможностей создания компьютерной игры с помощью искусственного интеллекта</h3><p>Автор проекта: Ешмухамбетов Айдар, ученик 5 «Б» класса.<br>Конкурс «Зерде 2026».</p><p>Эта игра — практический пример создания программного продукта через описание задач, генерацию кода и последовательную проверку. ИИ помогает создавать код, а человек определяет идею и проверяет результат.</p><p>Для исследования отдельно фиксируй использованные промпты, найденные ошибки, исправления и результаты испытаний. Сам факт генерации игры не доказывает выводы исследования.</p><p>Управление: A/D или ←/→ — движение вдоль пути; W/S или ↑/↓ — движение в глубину; SPACE — прыжок; SHIFT — рывок и атака; E — терминал и портал; ESC — пауза; M — звук; C — вернуть камеру. Перетаскивание мышью поворачивает и наклоняет камеру, колёсико меняет расстояние. На телефоне проведи по свободной области экрана для обзора; два пальца меняют масштаб. Врагов можно побеждать прыжком сверху.</p></div>'}

      ["В каком виде компьютер хранит любую информацию?", ["В виде картинок", "В виде нулей и единиц", "В виде букв", "На бумаге"], 1, "Компьютер кодирует текст, звук и изображения двоичным кодом — нулями и единицами."]
    ] },
    { title: "Безопасность в интернете", q: [
      ["Какой пароль самый надёжный?", ["123456", "qwerty", "Мой день рождения", "K7#mR2!pLq"], 3, "Надёжный пароль длинный и содержит большие и маленькие буквы, цифры и символы."],
      ["Незнакомец в сети просит твой адрес. Что делать?", ["Сообщить адрес", "Не отвечать и рассказать взрослым", "Отправить фото дома", "Попросить его номер"], 1, "Личные данные незнакомцам не сообщают. О таком случае нужно рассказать взрослым."],
      ["Что такое компьютерный вирус?", ["Полезная программа", "Вредоносная программа", "Деталь компьютера", "Сайт"], 1, "Вирус — вредоносная программа, которая может портить файлы и красть данные."],
      ["Что защищает компьютер от вирусов?", ["Антивирус", "Графический редактор", "Калькулятор", "Колонки"], 0, "Антивирус находит и удаляет вредоносные программы."],
      ["Пришло письмо: «Ты выиграл телефон! Перейди по ссылке». Что делать?", ["Сразу перейти", "Не переходить и удалить письмо", "Отправить друзьям", "Ввести пароль"], 1, "Это, скорее всего, мошенничество (фишинг). Подозрительные ссылки не открывают."]
    ] },
    { title: "Алгоритмы", q: [
      ["Что такое алгоритм?", ["Рисунок", "Точная последовательность действий для решения задачи", "Вид компьютера", "Случайный набор команд"], 1, "Алгоритм — понятная последовательность шагов, которая приводит к результату."],
      ["Как называется алгоритм, где команды выполняются одна за другой?", ["Линейный", "Циклический", "Разветвляющийся", "Случайный"], 0, "В линейном алгоритме команды выполняются по порядку, без условий и повторов."],
      ["«ЕСЛИ идёт дождь, ТО взять зонт» — какой это алгоритм?", ["Линейный", "Разветвляющийся", "Циклический", "Это не алгоритм"], 1, "Условие «если… то…» создаёт ветвление."],
      ["«Повтори 4 раза: шаг вперёд, поворот направо» — что здесь используется?", ["Ветвление", "Цикл", "Переменная", "Ошибка"], 1, "Повторение одних и тех же команд — это цикл."],
      ["Кто выполняет алгоритм?", ["Исполнитель", "Зритель", "Монитор", "Файл"], 0, "Исполнитель — тот, кто выполняет команды: робот, компьютер или человек."]
    ] },
    { title: "Программирование", q: [
      ["Как называется ошибка в программе?", ["Баг", "Пиксель", "Байт", "Курсор"], 0, "Ошибку в программе называют багом, а её поиск и исправление — отладкой."],
      ["Что такое программа?", ["Алгоритм, записанный на языке, понятном компьютеру", "Картинка на экране", "Деталь компьютера", "Файл с музыкой"], 0, "Программа — это алгоритм, записанный на языке программирования."],
      ["Что из этого — язык программирования?", ["Python", "Word", "Paint", "Google"], 0, "Python — язык программирования. Word и Paint — программы, Google — поисковая система."],
      ["Как в Vibe Coding называют задание для ИИ?", ["Промпт", "Пароль", "Папка", "Пиксель"], 0, "Промпт — текстовое задание, которое человек пишет искусственному интеллекту."],
      ["Что нужно сделать после того, как ИИ написал код?", ["Сразу сдать работу", "Запустить и проверить программу", "Удалить код", "Выключить компьютер"], 1, "Код от ИИ обязательно запускают и проверяют: человек отвечает за результат."]
    ] }
  ];

  var css = "#eduQuiz{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:rgba(4,5,20,.82);backdrop-filter:blur(4px);padding:16px;font:16px/1.45 system-ui,'Segoe UI',Arial,sans-serif;color:#eef2ff}" +
    "#eduQuiz .qb{width:min(560px,100%);max-height:100%;overflow:auto;background:linear-gradient(160deg,#16133f,#0b0a26);border:2px solid #22d3ee;border-radius:18px;padding:22px;box-shadow:0 0 50px rgba(34,211,238,.25)}" +
    "#eduQuiz .tag{font:800 12px/1 system-ui;letter-spacing:.2em;color:#22d3ee;text-transform:uppercase}" +
    "#eduQuiz h2{margin:8px 0 4px;font-size:22px}#eduQuiz .topic{color:#c4b5fd;margin:0 0 14px;font-weight:700}" +
    "#eduQuiz .q{font-size:19px;font-weight:700;margin:6px 0 14px}" +
    "#eduQuiz .opts{display:grid;gap:10px}#eduQuiz button{font:inherit;color:inherit;cursor:pointer;border-radius:12px;padding:12px 14px;text-align:left;border:1px solid rgba(167,139,250,.45);background:rgba(255,255,255,.06)}" +
    "#eduQuiz button:hover:not([disabled]){border-color:#22d3ee;background:rgba(34,211,238,.12)}#eduQuiz button[disabled]{cursor:default}" +
    "#eduQuiz .ok{border-color:#22c55e!important;background:rgba(34,197,94,.22)!important}#eduQuiz .bad{border-color:#f43f5e!important;background:rgba(244,63,94,.22)!important}" +
    "#eduQuiz .exp{margin:14px 0 0;padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.07)}" +
    "#eduQuiz .next{margin-top:14px;width:100%;text-align:center;font-weight:800;background:linear-gradient(90deg,#22d3ee,#a78bfa);color:#0a0b2e;border:0}" +
    "#eduQuiz .prog{display:flex;gap:6px;margin:10px 0 0}#eduQuiz .prog i{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.15)}#eduQuiz .prog i.on{background:#22d3ee}";

  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function h(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

  // sector: индекс пройденного сектора (0–5); reward(n): начисление награды; done(): продолжить игру
  function show(sector, reward, done) {
    if (document.getElementById("eduQuiz")) return;
    if (!document.getElementById("eduQuizCss")) { var st = h("style"); st.id = "eduQuizCss"; st.textContent = css; document.head.appendChild(st); }
    var topic = TOPICS[Math.max(0, Math.min(TOPICS.length - 1, sector))];
    var qs = shuffle(topic.q).slice(0, 3), i = 0, right = 0;
    var ov = h("div"); ov.id = "eduQuiz"; var box = h("div", "qb"); ov.appendChild(box); document.body.appendChild(ov);
    function stop(e) { e.stopPropagation(); }
    ["keydown", "keyup"].forEach(function (t) { ov.addEventListener(t, stop); });
    function render() {
      box.innerHTML = "";
      var q = qs[i];
      box.appendChild(h("div", "tag", "Киберзащита сектора · вопрос " + (i + 1) + " из " + qs.length));
      box.appendChild(h("h2", null, "Проверь знания по информатике"));
      box.appendChild(h("p", "topic", "Тема: " + topic.title));
      var prog = h("div", "prog"); for (var k = 0; k < qs.length; k++) { var bar = h("i", k < i ? "on" : ""); prog.appendChild(bar); } box.appendChild(prog);
      box.appendChild(h("p", "q", q[0]));
      var opts = h("div", "opts"), btns = [];
      shuffle(q[1].map(function (t, n) { return [t, n]; })).forEach(function (o) {
        var b = h("button", null, o[0]); btns.push([b, o[1]]);
        b.onclick = function () {
          btns.forEach(function (x) { x[0].disabled = true; if (x[1] === q[2]) x[0].classList.add("ok"); });
          var good = o[1] === q[2]; if (good) right++; else b.classList.add("bad");
          box.appendChild(h("p", "exp", (good ? "Верно! " : "Неверно. ") + q[3]));
          var nx = h("button", "next", i < qs.length - 1 ? "Следующий вопрос →" : "Узнать результат →");
          nx.onclick = function () { i++; if (i < qs.length) render(); else finish(); };
          box.appendChild(nx); nx.focus();
        };
        opts.appendChild(b);
      });
      box.appendChild(opts);
    }
    function finish() {
      var bonus = right * 20;
      try { if (bonus) reward(bonus); } catch (e) {}
      box.innerHTML = "";
      box.appendChild(h("div", "tag", "Сектор " + (sector + 1) + " защищён"));
      box.appendChild(h("h2", null, "Правильных ответов: " + right + " из " + qs.length));
      box.appendChild(h("p", "topic", right === qs.length ? "Отлично! Ты настоящий кибергерой." : right ? "Хорошо! Повтори тему — и в следующий раз будет лучше." : "Не страшно! Прочитай объяснения и попробуй снова."));
      box.appendChild(h("p", "exp", bonus ? "Награда: +" + bonus + " монет за правильные ответы." : "Награда за ответы: 0 монет."));
      var go = h("button", "next", "Продолжить игру →");
      go.onclick = function () { ov.remove(); done(); };
      box.appendChild(go); go.focus();
    }
    render();
  }
  window.EduQuiz = { show: show, topics: TOPICS };
})();
</script>
<script>
// Викторина между секторами (ChatGPT-версия)
(function () {
  var origStart = start;
  start = function (i) {
    if (mode === "win" && !document.getElementById("eduQuiz") && (i === level + 1 || (level === 5 && i === 0))) {
      var from = level;
      EduQuiz.show(from, function (n) { save.coins += n; persist(); }, function () { origStart(i); });
      return;
    }
    return origStart(i);
  };
})();
</script>
</html>
